<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <style>
        @keyframes pastelHover {
            0% { background-color: #FFD1DC; }
            25% { background-color: #FFDFBA; }
            50% { background-color: #BAE1FF; }
            75% { background-color: #BFFCC6; }
            100% { background-color: #FFD1DC; }
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #FFD1DC, #BAE1FF, #BFFCC6);
            min-height: 100vh;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 800px;
        }

        form {
            margin-bottom: 20px;
        }

        input[type="file"] {
            padding: 10px;
            border: 2px solid #ccc;
            border-radius: 25px;
            width: 100%;
            margin-bottom: 10px;
        }

        button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #FFD1DC, #BAE1FF);
            color: #333;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background: linear-gradient(135deg, #BAE1FF, #BFFCC6);
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        li:hover {
            transform: translateY(-5px);
            box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.2);
        }

        a {
            color: #BAE1FF;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .logout-link {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: linear-gradient(135deg, #FFD1DC, #BAE1FF);
            color: #333;
            border-radius: 25px;
            text-decoration: none;
            transition: background 0.3s ease;
        }

        .logout-link:hover {
            background: linear-gradient(135deg, #BAE1FF, #BFFCC6);
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Welcome, {{ current_user.username }}!</h2>
        
        <!-- Upload Form -->
        <form method="POST" action="{{ url_for('upload_file') }}" enctype="multipart/form-data">
            <input type="file" name="file" required>
            <button type="submit">Upload</button>
        </form>

        <h3>Your Uploaded Summaries:</h3>
        <ul>
            {% for summary in summaries %}
                <li>
                    <strong>{{ summary.filename }}</strong> 
                    <br><strong>Transcript:</strong> {{ summary.transcript }} 
                    <br><strong>Summary:</strong> {{ summary.summary }}
                    <br><a href="{{ url_for('download_summary', filename=summary.filename) }}">Download PDF</a>
                    
                    <!-- Delete Button (Form should be inside the loop) -->
                    <form method="POST" action="{{ url_for('delete_file', filename=summary.filename) }}" style="margin-top: 10px;">
                        <button type="submit" onclick="return confirm('Are you sure you want to delete this file?')">Delete</button>
                    </form>
                </li>
            {% endfor %}
        </ul>

        <a href="{{ url_for('logout') }}" class="logout-link">Logout</a>
    </div>
</body>
</html>
